<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="User Address">
  <!--
    Same mark as src/components/BrandIcon.jsx — keep both in sync.

    Path taken verbatim from @mui/icons-material/AssignmentInd: a clipboard
    with a person.

    Colors mirror palette.primary.main in src/theme/ThemeModeProvider.jsx:
      light #3E5C76, dark #8FB3CE.
    A favicon cannot read the in-app theme toggle, so it follows the operating
    system color scheme instead; browsers that ignore the media query fall back
    to the light value.
  -->
  <style>
    path { fill: #3E5C76; }
    @media (prefers-color-scheme: dark) {
      path { fill: #8FB3CE; }
    }
  </style>
